# Release pipeline for OpenKoi
# Triggered by pushing a tag matching vYYYY.M.D (CalVer, e.g. v2025.2.19)
# Tag version must match the version in Cargo.toml (without the 'v' prefix)
# Cross-compiles for 4 targets (Linux/macOS), creates GitHub Release with artifacts

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            binary: openkoi
            archive: openkoi-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            binary: openkoi
            archive: openkoi-linux-arm64.tar.gz

          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: openkoi
            archive: openkoi-macos-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macos-latest
            binary: openkoi
            archive: openkoi-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2.8.2

      # Linux cross-compilation dependencies
      - name: Install musl tools (Linux)
        if: contains(matrix.target, 'linux-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (Linux ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5

      # Build
      # sqlite-vec 0.1.6 uses BSD-only u_int*_t types that don't exist in musl.
      # Defining __COSMOPOLITAN__ skips the problematic typedef block in sqlite-vec.c.
      - name: Build (native)
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CFLAGS_x86_64_unknown_linux_musl: -D__COSMOPOLITAN__

      - name: Build (cross, ARM64)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --locked --target ${{ matrix.target }}
        env:
          CFLAGS_aarch64_unknown_linux_musl: -D__COSMOPOLITAN__

      # Package
      - name: Package (Unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.archive }} ${{ matrix.binary }}
          cd ../../..
          if command -v sha256sum &>/dev/null; then
            sha256sum ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          else
            shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Find the previous tag (the one right before this one)
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -n1)
          if [ -z "$PREV_TAG" ]; then
            # First release — use all commits
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..${TAG}"
          fi
          # Build changelog from conventional-ish commit subjects
          {
            echo "## What's Changed"
            echo ""
            git log --pretty=format:"- %s (%h)" "$RANGE" -- | while IFS= read -r line; do
              echo "$line"
            done
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/openkoi-ai/openkoi/compare/${PREV_TAG:-$(git rev-list --max-parents=0 HEAD | head -1)}...${TAG}"
          } > release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: "!contains(github.ref, 'beta') && !contains(github.ref, 'rc')"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Update Homebrew formula in openkoi-ai/homebrew-openkoi
  homebrew:
    name: Update Homebrew formula
    runs-on: ubuntu-latest
    needs: release
    if: "!contains(github.ref, 'beta') && !contains(github.ref, 'rc')"

    steps:
      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums from release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN_OPENKOI }}
        run: |
          gh release download "v${{ steps.version.outputs.version }}" \
            --repo openkoi-ai/openkoi \
            --pattern "*.sha256" \
            --dir checksums

      - name: Parse SHA256 values
        id: sha
        run: |
          echo "macos_arm64=$(awk '{print $1}' checksums/openkoi-macos-arm64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "macos_x86_64=$(awk '{print $1}' checksums/openkoi-macos-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(awk '{print $1}' checksums/openkoi-linux-arm64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(awk '{print $1}' checksums/openkoi-linux-x86_64.tar.gz.sha256)" >> "$GITHUB_OUTPUT"

      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: openkoi-ai/homebrew-openkoi
          token: ${{ secrets.HOMEBREW_TAP_TOKEN_OPENKOI }}

      - name: Update formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA_MACOS_ARM64="${{ steps.sha.outputs.macos_arm64 }}"
          SHA_MACOS_X86_64="${{ steps.sha.outputs.macos_x86_64 }}"
          SHA_LINUX_ARM64="${{ steps.sha.outputs.linux_arm64 }}"
          SHA_LINUX_X86_64="${{ steps.sha.outputs.linux_x86_64 }}"

          # Write formula — quoted heredoc preserves Ruby #{} interpolation literally
          cat > Formula/openkoi.rb <<'FORMULA'
          class Openkoi < Formula
            desc "Executive Function as a Service. AI agent that thinks before it acts."
            homepage "https://openkoi.ai"
            version "___VERSION___"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/openkoi-ai/openkoi/releases/download/v#{version}/openkoi-macos-arm64.tar.gz"
                sha256 "___SHA_MACOS_ARM64___"
              end
              on_intel do
                url "https://github.com/openkoi-ai/openkoi/releases/download/v#{version}/openkoi-macos-x86_64.tar.gz"
                sha256 "___SHA_MACOS_X86_64___"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/openkoi-ai/openkoi/releases/download/v#{version}/openkoi-linux-arm64.tar.gz"
                sha256 "___SHA_LINUX_ARM64___"
              end
              on_intel do
                url "https://github.com/openkoi-ai/openkoi/releases/download/v#{version}/openkoi-linux-x86_64.tar.gz"
                sha256 "___SHA_LINUX_X86_64___"
              end
            end

            def install
              bin.install "openkoi"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/openkoi --version")
            end
          end
          FORMULA

          # Replace placeholders with actual values
          sed -i "s/___VERSION___/${VERSION}/g" Formula/openkoi.rb
          sed -i "s/___SHA_MACOS_ARM64___/${SHA_MACOS_ARM64}/g" Formula/openkoi.rb
          sed -i "s/___SHA_MACOS_X86_64___/${SHA_MACOS_X86_64}/g" Formula/openkoi.rb
          sed -i "s/___SHA_LINUX_ARM64___/${SHA_LINUX_ARM64}/g" Formula/openkoi.rb
          sed -i "s/___SHA_LINUX_X86_64___/${SHA_LINUX_X86_64}/g" Formula/openkoi.rb

      - name: Commit and push
        run: |
          git config user.name "openkoi[bot]"
          git config user.email "openkoi[bot]@openkoi.ai"
          git add Formula/openkoi.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "openkoi ${{ steps.version.outputs.version }}"
          git push
